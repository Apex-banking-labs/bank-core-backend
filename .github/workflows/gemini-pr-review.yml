name: "Run ai-reviewer"

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:


jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Gemini Review Bot
        uses: Nasubikun/ai-reviewer@v1.0.6
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGUAGE: "English"
          MODEL_CODE: "models/gemini-2.5-flash-preview-04-17"
          USE_SINGLE_COMMENT_REVIEW: "true"
          EXTRA-PROMPT: |
            You are an expert Principal Software Engineer reviewing this banking application Pull Request. 
            Analyze the git diff meticulously. Provide clear, professional, and actionable feedback.
            
            Enforce the following criteria:
            1. Check for missing error handling, input validation bypasses, or structural logic flaws.
            2. If Java/Spring Boot code is modified, verify proper declarative database transaction boundaries (@Transactional), secure DTO logic mapping, and ACID compliance safety.
            3. If Node.js/Fastify code is modified, check for non-blocking asynchronous event handling consistency.
            4. Suggest performance optimizations or security improvements (e.g., SQL injection risks, unsafe hashing, memory leaks).
            5. Ensure code changes are accompanied by matching unit or integration test layers.
            
            Format your responses cleanly. Be direct, helpful, and utilize precise professional terminology.