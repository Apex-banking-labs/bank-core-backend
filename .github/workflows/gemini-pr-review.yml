name: Gemini Automated Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini PR Review Engine
        uses: google-gemini/gemini-github-actions/review@v1 # Production pre-built community wrapper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided natively by GitHub Actions execution
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Your secure custom secret token
        with:
          model: 'gemini-1.5-pro' # Utilizing a deeper analytical reasoning engine for code diagnostics
          prompt: |
            You are an expert Principal Software Engineer reviewing a Pull Request. 
            Analyze the git diff meticulously. Provide clear, professional, and actionable feedback.
            
            Enforce the following criteria:
            1. Check for missing error handling, input validation bypasses, or structural logic flaws.
            2. If Java/Spring Boot code is modified, verify proper declarative database transaction boundaries (@Transactional) and ACID compliance safety.
            3. If Node.js/Fastify code is modified, check for non-blocking asynchronous event handling consistency.
            4. Suggest performance optimizations or security improvements (e.g., SQL injection risks, unsafe hashing, memory leaks).
            5. Ensure code changes are accompanied by matching unit or integration test layers.
            
            Format your responses cleanly. Be direct, helpful, and utilize precise professional terminology.